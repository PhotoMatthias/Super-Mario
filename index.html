<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Captain Kibi's Sky Run</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #111;
    font-family: 'Courier New', Courier, monospace;
  }
  #game-container {
    position: relative;
    width: 100vw;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  /* HUD */
  #hud {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    right: max(16px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    z-index: 10;
  }
  .hud-box {
    background: rgba(0, 0, 0, 0.45);
    padding: 6px 12px;
    border-radius: 8px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    display: flex;
    gap: 14px;
    align-items: center;
  }
  /* Touch Controls */
  #controls {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: max(20px, env(safe-area-inset-left));
    right: max(20px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  .d-pad {
    display: flex;
    gap: 16px;
    pointer-events: auto;
  }
  .action-pad {
    display: flex;
    pointer-events: auto;
  }
  .ctrl-btn {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    border: 3px solid rgba(255, 255, 255, 0.65);
    color: white;
    font-size: 32px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 6px 15px rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: transform 0.05s, background 0.05s;
  }
  .ctrl-btn.jump-btn {
    width: 88px;
    height: 88px;
    background: rgba(255, 193, 7, 0.32);
    border-color: rgba(255, 213, 79, 0.85);
    font-size: 20px;
    letter-spacing: 1px;
  }
  .ctrl-btn.active {
    background: rgba(255, 255, 255, 0.55);
    transform: scale(0.92);
  }
  .ctrl-btn.jump-btn.active {
    background: rgba(255, 193, 7, 0.65);
    transform: scale(0.92);
  }
  /* Overlay Menus */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    color: white;
    text-align: center;
    padding: 20px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .hidden {
    display: none !important;
  }
  .menu-card {
    background: #1e293b;
    border: 4px solid #38bdf8;
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 12px 30px rgba(0,0,0,0.7);
  }
  .menu-title {
    font-size: 28px;
    color: #38bdf8;
    text-shadow: 3px 3px 0 #000;
    margin-bottom: 12px;
  }
  .menu-subtitle {
    font-size: 15px;
    color: #cbd5e1;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .menu-btn {
    background: #f59e0b;
    color: #000;
    border: 3px solid #fff;
    padding: 14px 28px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 5px 0 #b45309;
    transition: transform 0.1s;
    display: inline-block;
  }
  .menu-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #b45309;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-box">
      <span id="hud-lives">❤️❤️❤️</span>
      <span id="hud-coins">🪙 0</span>
    </div>
    <div class="hud-box">
      <span id="hud-level">LVL 1</span>
      <span id="hud-score">⭐ 0</span>
    </div>
  </div>

  <!-- Touch Buttons -->
  <div id="controls" class="hidden">
    <div class="d-pad">
      <div class="ctrl-btn" id="btn-left">◀</div>
      <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div class="action-pad">
      <div class="ctrl-btn jump-btn" id="btn-jump">JUMP</div>
    </div>
  </div>

  <!-- Hauptmenü & Status-Screens -->
  <div id="menu-overlay" class="overlay">
    <div class="menu-card">
      <div class="menu-title" id="overlay-title">CAPTAIN KIBI</div>
      <div class="menu-subtitle" id="overlay-text">
        Hilf dem kleinen Retro-Piloten Kibi durch 3 Welten!<br><br>
        Sammle Münzen, springe von oben auf Gegner und erreiche den goldenen Pokal.<br><br>
        💡 <i>Tipp: Halte dein iPhone im Querformat für die beste Übersicht!</i>
      </div>
      <button class="menu-btn" id="btn-start">SPIEL STARTEN</button>
    </div>
  </div>
</div>

<script>
// --- AUDIO SYNTHESIZER (Ohne externe Dateien) ---
const AudioFX = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  playTone(freq, type, duration, slideFreq = null, vol = 0.12) {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      if (slideFreq) {
        osc.frequency.exponentialRampToValueAtTime(slideFreq, this.ctx.currentTime + duration);
      }
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  },
  jump() { this.playTone(220, 'square', 0.18, 520, 0.1); },
  coin() {
    this.playTone(987, 'sine', 0.08, null, 0.12);
    setTimeout(() => this.playTone(1318, 'sine', 0.22, null, 0.12), 70);
  },
  stomp() { this.playTone(320, 'triangle', 0.15, 110, 0.18); },
  hurt() { this.playTone(190, 'sawtooth', 0.3, 75, 0.16); },
  win() {
    const notes = [523, 659, 783, 1046];
    notes.forEach((n, i) => setTimeout(() => this.playTone(n, 'square', 0.18, null, 0.12), i * 110));
  }
};

// --- CANVAS SETUP ---

const ctx = canvas.getContext('2d');

const V_HEIGHT = 450;
let V_WIDTH = 800;

function resizeCanvas() {
  const aspect = window.innerWidth / window.innerHeight;
  V_WIDTH = Math.max(360, Math.round(V_HEIGHT * aspect));
  canvas.width = V_WIDTH;
  canvas.height = V_HEIGHT;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- SPIELER (CAPTAIN KIBI) ---
const player = {
  x: 80, y: 280, w: 32, h: 38,
  vx: 0, vy: 0,
  speed: 4.6,
  jumpForce: -11.8,
  grounded: false,
  facing: 1,
  invuln: 0,
  platformDX: 0
};

let activePlatforms = [];
let activeCoins = [];
let activeEnemies = [];
let clouds = [];

function initClouds() {
  clouds = [];
  for (let i = 0; i < 18; i++) {
    clouds.push({
      x: i * 240 + Math.random() * 100,
      y: 35 + Math.random() * 130,
      w: 64 + Math.random() * 48,
      speed: 0.2 + Math.random() * 0.3
    });
  }
}

function loadLevel(idx) {
  const lvl = LEVELS[idx];
  player.x = 60;
  player.y = 260;
  player.vx = 0;
  player.vy = 0;
  player.grounded = false;
  player.invuln = 0;
  cameraX = 0;

  activePlatforms = lvl.platforms.map(p => ({
    ...p,
    baseX: p.x,
    dx: 0,
    dir: 1
  }));
  activeCoins = lvl.coins.map(c => ({ ...c, collected: false }));
  activeEnemies = lvl.enemies.map(e => ({
    ...e,
    w: 32,
    h: 32,
    dir: e.speed > 0 ? 1 : -1,
    speed: Math.abs(e.speed),
    alive: true
  }));
  initClouds();
  updateHUD();
}

function spawnParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.7) * 6,
      size: 4 + Math.random() * 4,
      color,
      life: 24 + Math.random() * 12
    });
  }
}

// --- HUD & OVERLAYS ---
const hudEl = document.getElementById('hud');
const controlsEl = document.getElementById('controls');
const menuOverlay = document.getElementById('menu-overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayText = document.getElementById('overlay-text');
const btnStart = document.getElementById('btn-start');

function updateHUD() {
  document.getElementById('hud-lives').textContent = '❤️'.repeat(Math.max(0, lives));
  document.getElementById('hud-coins').textContent = `🪙 ${coinsCollected}`;
  document.getElementById('hud-level').textContent = `LVL ${currentLevelIdx + 1}`;
  document.getElementById('hud-score').textContent = `⭐ ${score}`;
}

function showOverlay(title, text, btnLabel) {
  overlayTitle.textContent = title;
  overlayText.innerHTML = text;
  btnStart.textContent = btnLabel;
  menuOverlay.classList.remove('hidden');
  hudEl.classList.add('hidden');
  controlsEl.classList.add('hidden');
}

btnStart.addEventListener('click', () => {
  AudioFX.init();
  if (gameState === 'MENU' || gameState === 'GAMEOVER' || gameState === 'VICTORY') {
    currentLevelIdx = 0;
    score = 0;
    coinsCollected = 0;
    lives = 3;
  } else if (gameState === 'LEVEL_CLEAR') {
    currentLevelIdx++;
  }
  loadLevel(currentLevelIdx);
  gameState = 'PLAYING';
  menuOverlay.classList.add('hidden');
  hudEl.classList.remove('hidden');
  controlsEl.classList.remove('hidden');
});

// --- TOUCH & KEYBOARD EVENTS ---
function bindTouchButton(id, keyName) {
  const btn = document.getElementById(id);
  const activate = (e) => {
    e.preventDefault();
    AudioFX.init();
    if (keyName === 'jump' && !keys.jump) keys.jumpPressed = true;
    keys[keyName] = true;
    btn.classList.add('active');
  };
  const deactivate = (e) => {
    e.preventDefault();
    keys[keyName] = false;
    btn.classList.remove('active');
  };
  btn.addEventListener('touchstart', activate, { passive: false });
  btn.addEventListener('touchend', deactivate, { passive: false });
  btn.addEventListener('touchcancel', deactivate, { passive: false });
  btn.addEventListener('mousedown', activate);
  window.addEventListener('mouseup', () => {
    if (keys[keyName]) {
      keys[keyName] = false;
      btn.classList.remove('active');
    }
  });
}

bindTouchButton('btn-left', 'left');
bindTouchButton('btn-right', 'right');
bindTouchButton('btn-jump', 'jump');

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    if (!keys.jump) keys.jumpPressed = true;
    keys.jump = true;
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
});

// Verhindert Standard-Scrollen auf iOS
document.addEventListener('touchmove', (e) => {
  if (gameState === 'PLAYING') e.preventDefault();
}, { passive: false });

// --- UPDATE LOGIK ---
function loseLife() {
  AudioFX.hurt();
  lives--;
  updateHUD();
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ef4444', 16);
  if (lives <= 0) {
    gameState = 'GAMEOVER';
    showOverlay(
      'GAME OVER',
      `Du hast tapfer gekämpft, aber keine Herzen mehr!<br><br>Erreichte Punkte: <b>${score}</b><br>Gesammelte Münzen: <b>${coinsCollected}</b>`,
      'NOCHMAL VERSUCHEN'
    );
  } else {
    player.x = 60;
    player.y = 240;
    player.vx = 0;
    player.vy = 0;
    player.invuln = 90;
    cameraX = 0;
  }
}

function updateGame() {
  if (gameState !== 'PLAYING') return;
  animTick++;

  if (player.invuln > 0) player.invuln--;

  // 1. Bewegliche Plattformen aktualisieren
  for (const p of activePlatforms) {
    if (p.moveX) {
      const prevX = p.x;
      p.x += p.speed * p.dir;
      if (p.x > p.baseX + p.moveX) { p.x = p.baseX + p.moveX; p.dir = -1; }
      if (p.x < p.baseX) { p.x = p.baseX; p.dir = 1; }
      p.dx = p.x - prevX;
    } else {
      p.dx = 0;
    }
  }

  // 2. Spieler-Horizontalbewegung
  if (keys.left) {
    player.vx = -player.speed;
    player.facing = -1;
  } else if (keys.right) {
    player.vx = player.speed;
    player.facing = 1;
  } else {
    player.vx *= 0.75;
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
  }

  // Mitnahme auf beweglicher Plattform
  player.x += player.vx + (player.grounded ? player.platformDX : 0);
  if (player.x < 0) player.x = 0;

  // Horizontale Plattform-Kollision
  for (const p of activePlatforms) {
    if (
      player.x < p.x + p.w &&
      player.x + player.w > p.x &&
      player.y < p.y + p.h &&
      player.y + player.h > p.y
    ) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  }

  // 3. Sprung & Schwerkraft
  if (keys.jumpPressed && player.grounded) {
    player.vy = player.jumpForce;
    player.grounded = false;
    player.platformDX = 0;
    AudioFX.jump();
    spawnParticles(player.x + player.w / 2, player.y + player.h, '#e2e8f0', 6);
  }
  keys.jumpPressed = false;

  player.vy += 0.52; // Gravitation
  if (player.vy > 12) player.vy = 12;

  const prevBottom = player.y + player.h;
  player.y += player.vy;
  player.grounded = false;
  player.platformDX = 0;

  // Vertikale Plattform-Kollision
  for (const p of activePlatforms) {
    if (
      player.x < p.x + p.w &&
      player.x + player.w > p.x &&
      player.y < p.y + p.h &&
      player.y + player.h > p.y
    ) {
      if (player.vy >= 0 && prevBottom <= p.y + 14) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
        player.platformDX = p.dx;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  // Abgrund-Prüfung
  if (player.y > V_HEIGHT + 60) {
    loseLife();
    return;
  }

  // 4. Münzen sammeln
  for (const c of activeCoins) {
    if (!c.collected) {
      const dx = (player.x + player.w / 2) - (c.x + 10);
      const dy = (player.y + player.h / 2) - (c.y + 10);
      if (Math.hypot(dx, dy) < 26) {
        c.collected = true;
        coinsCollected++;
        score += 50;
        AudioFX.coin();
        spawnParticles(c.x + 10, c.y + 10, '#facc15', 8);
        updateHUD();
      }
    }
  }

  // 5. Gegner aktualisieren & Kollision
  for (const e of activeEnemies) {
    if (!e.alive) continue;
    e.x += e.speed * e.dir;
    if (e.x > e.maxX) { e.x = e.maxX; e.dir = -1; }
    if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }

    const enemyY = e.type === 'flyer' ? e.y + Math.sin(animTick * 0.08) * 12 : e.y;

    if (
      player.x < e.x + e.w - 4 &&
      player.x + player.w > e.x + 4 &&
      player.y < enemyY + e.h - 4 &&
      player.y + player.h > enemyY + 4
    ) {
      // Sprung von oben auf den Gegner
      if (player.vy > 0 && prevBottom <= enemyY + 18) {
        e.alive = false;
        player.vy = -9.2;
        score += 100;
        AudioFX.stomp();
        spawnParticles(e.x + 16, enemyY + 16, '#a855f7', 12);
        updateHUD();
      } else if (player.invuln <= 0) {
        loseLife();
        return;
      }
    }
  }

  // 6. Zielpokal erreicht?
  const lvl = LEVELS[currentLevelIdx];
  if (player.x + player.w > lvl.goalX && player.x < lvl.goalX + 48) {
    AudioFX.win();
    score += 250;
    updateHUD();
    if (currentLevelIdx < LEVELS.length - 1) {
      gameState = 'LEVEL_CLEAR';
      showOverlay(
        `LEVEL ${currentLevelIdx + 1} GESCHAFFT!`,
        `Stark geflogen, Captain Kibi!<br><br>Nächste Etappe: <b>${LEVELS[currentLevelIdx + 1].name}</b><br>Dein Punktestand: <b>${score}</b>`,
        'WEITER ZU LEVEL ' + (currentLevelIdx + 2)
      );
    } else {
      gameState = 'VICTORY';
      showOverlay(
        '🏆 GESAMTSIEG! 🏆',
        `Du hast alle 3 Welten gemeistert und den goldenen Himmelspokal erobert!<br><br>Endpunktzahl: <b>${score}</b><br>Münzen: <b>${coinsCollected}</b>`,
        'NEUES SPIEL STARTEN'
      );
    }
  }

  // 7. Kamera sanft nachführen
  const targetCamX = Math.max(0, player.x - V_WIDTH * 0.35);
  cameraX += (targetCamX - cameraX) * 0.12;

  // 8. Partikel aktualisieren
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.25;
    pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }
}

// --- PIXEL-ART RENDERING ---
function drawPlayer(x, y) {
  if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(Math.round(x + player.w / 2), Math.round(y + player.h / 2));
  ctx.scale(player.facing, 1);

  const runOffset = (player.grounded && Math.abs(player.vx) > 0.5)
    ? Math.sin(animTick * 0.35) * 4 : 0;

  // Fliegerschal (weht nach hinten)
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(-18, -2 + (runOffset * 0.3), 10, 6);
  ctx.fillRect(-22, 0 + (runOffset * 0.5), 6, 5);

  // Körper (Blauer Piloten-Overall)
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(-12, -10, 24, 22);

  // Heller Bauchstreifen
  ctx.fillStyle = '#e0f2fe';
  ctx.fillRect(-6, -4, 14, 14);

  // Kopf / Fliegerkappe
  ctx.fillStyle = '#78350f';
  ctx.fillRect(-13, -19, 26, 11);

  // Fliegerbrille (Goggles) auf der Stirn
  ctx.fillStyle = '#facc15';
  ctx.fillRect(-4, -18, 18, 7);
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(-2, -17, 6, 5);
  ctx.fillRect(6, -17, 6, 5);

  // Gesicht & Auge
  ctx.fillStyle = '#fde68a';
  ctx.fillRect(-4, -10, 16, 8);
  ctx.fillStyle = '#000';
  ctx.fillRect(6, -8, 3, 4);

  // Schuhe (animiert)
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(-10 + runOffset, 12, 9, 7);
  ctx.fillRect(2 - runOffset, 12, 9, 7);

  ctx.restore();
}

function drawEnemy(e) {
  const enemyY = e.type === 'flyer' ? e.y + Math.sin(animTick * 0.08) * 12 : e.y;
  const ex = Math.round(e.x - cameraX);
  const ey = Math.round(enemyY);

  if (e.type === 'walker') {
    // Lila Stachel-Gumba
    ctx.fillStyle = '#7e22ce';
    ctx.fillRect(ex + 2, ey + 6, 28, 22);
    // Kleine Stacheln/Ohren
    ctx.fillStyle = '#a855f7';
    ctx.fillRect(ex + 4, ey, 6, 6);
    ctx.fillRect(ex + 22, ey, 6, 6);
    // Grimmige Augen
    ctx.fillStyle = '#fff';
    ctx.fillRect(ex + 6, ey + 11, 6, 6);
    ctx.fillRect(ex + 20, ey + 11, 6, 6);
    ctx.fillStyle = '#000';
    ctx.fillRect(ex + 8, ey + 13, 3, 4);
    ctx.fillRect(ex + 21, ey + 13, 3, 4);
    // Füße
    const step = Math.floor(animTick / 8) % 2 === 0 ? 2 : -2;
    ctx.fillStyle = '#3b0764';
    ctx.fillRect(ex + 4 + step, ey + 28, 8, 4);
    ctx.fillRect(ex + 20 - step, ey + 28, 8, 4);
  } else {
    // Rote Schwebe-Drohne
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(ex + 4, ey + 8, 24, 18);
    // Propeller oben
    ctx.fillStyle = '#cbd5e1';
    const propW = Math.floor(animTick / 3) % 2 === 0 ? 26 : 10;
    ctx.fillRect(ex + 16 - propW / 2, ey + 2, propW, 4);
    ctx.fillRect(ex + 14, ey + 4, 4, 4);
    // Leuchtendes Visier
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(ex + 8, ey + 13, 16, 6);
  }
}

function drawGoal(goalX) {
  const gx = Math.round(goalX - cameraX);
  const gy = 300;
  // Sockel
  ctx.fillStyle = '#475569';
  ctx.fillRect(gx, gy + 64, 44, 16);
  // Goldener Pokal / Zielflagge
  const glow = Math.sin(animTick * 0.1) * 4;
  ctx.fillStyle = '#facc15';
  ctx.fillRect(gx + 8, gy + 10 + glow, 28, 34);
  ctx.fillRect(gx + 16, gy + 44 + glow, 12, 16);
  ctx.fillRect(gx + 10, gy + 58 + glow, 24, 6);
  // Glanz
  ctx.fillStyle = '#fef08a';
  ctx.fillRect(gx + 12, gy + 14 + glow, 6, 20);
}

function renderGame() {
  const lvl = LEVELS[currentLevelIdx] || LEVELS[0];

  // 1. Himmel-Farbverlauf
  const grad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
  grad.addColorStop(0, lvl.skyTop);
  grad.addColorStop(1, lvl.skyBottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

  // 2. Parallax-Berge im Hintergrund
  ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
  for (let i = 0; i < 8; i++) {
    const mx = ((i * 320) - (cameraX * 0.25)) % 2200;
    ctx.beginPath();
    ctx.moveTo(mx, V_HEIGHT);
    ctx.lineTo(mx + 180, 170);
    ctx.lineTo(mx + 360, V_HEIGHT);
    ctx.fill();
  }

  // 3. Pixel-Wolken
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  for (const c of clouds) {
    const cx = Math.round(c.x - cameraX * 0.4);
    ctx.fillRect(cx, c.y, c.w, 22);
    ctx.fillRect(cx + 12, c.y - 10, c.w - 24, 10);
  }

  // 4. Plattformen zeichnen
  for (const p of activePlatforms) {
    const px = Math.round(p.x - cameraX);
    if (px + p.w < -50 || px > V_WIDTH + 50) continue;

    // Erde / Stein
    ctx.fillStyle = lvl.dirtColor;
    ctx.fillRect(px, p.y, p.w, p.h);

    // Gras- / Oberkante
    ctx.fillStyle = lvl.groundColor;
    ctx.fillRect(px, p.y, p.w, 10);

    // Pixel-Struktur
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let bx = 8; bx < p.w - 12; bx += 28) {
      ctx.fillRect(px + bx, p.y + 16, 12, 6);
    }
  }

  // 5. Münzen zeichnen
  for (const c of activeCoins) {
    if (c.collected) continue;
    const cx = Math.round(c.x - cameraX);
    const cy = Math.round(c.y + Math.sin(animTick * 0.1 + c.x) * 3);
    const spinW = Math.max(4, Math.abs(Math.cos(animTick * 0.08)) * 16);

    ctx.fillStyle = '#eab308';
    ctx.fillRect(cx + 10 - spinW / 2, cy, spinW, 20);
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(cx + 10 - spinW / 4, cy + 4, spinW / 2, 12);
  }

  // 6. Zielpokal
  drawGoal(lvl.goalX);

  // 7. Gegner
  for (const e of activeEnemies) {
    if (e.alive) drawEnemy(e);
  }

  // 8. Captain Kibi
  drawPlayer(player.x - cameraX, player.y);

  // 9. Partikel
  for (const pt of particles) {
    ctx.fillStyle = pt.color;
    ctx.fillRect(Math.round(pt.x - cameraX), Math.round(pt.y), pt.size, pt.size);
  }
}

// --- HAUPTSCHLEIFE ---
function gameLoop() {
  updateGame();
  renderGame();
  requestAnimationFrame(gameLoop);
}

loadLevel(0);
requestAnimationFrame(gameLoop);
</script>
